<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Admin | QLD Agent Finder</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="portal.css">
</head>
<body>

<!-- LOGIN -->
<section class="login" id="loginView" hidden>
  <form class="box" id="loginForm">
    <div class="brand"><img src="favicon.svg" width="34" height="34" alt=""><span><b>QLD</b> Agent Finder · Admin</span></div>
    <label for="lEmail">Email</label><input id="lEmail" type="email" autocomplete="email" required>
    <label for="lPass">Password</label><input id="lPass" type="password" autocomplete="current-password" required>
    <div class="row" style="justify-content:stretch"><button class="btn" style="flex:1" type="submit">Log in</button></div>
    <p class="msg err" id="loginMsg" role="alert"></p>
  </form>
</section>

<!-- NOT CONFIGURED -->
<section class="login" id="setupView" hidden>
  <div class="box"><div class="brand"><span><b>QLD</b> Agent Finder · Admin</span></div>
  <h2>Almost there</h2><p>Add your Supabase URL and anon key to <b>config.js</b> in the admin folder, then re-upload. See the README for steps.</p></div>
</section>

<!-- APP -->
<div id="appView" hidden>
  <header class="top">
    <div class="brand"><img src="favicon.svg" width="30" height="30" alt=""><span><b>QLD</b> Admin</span></div>
    <nav class="tabs" id="tabs" aria-label="Sections">
      <button data-tab="overview" class="on">Overview</button>
      <button data-tab="applications">Applications<span class="pill" id="pPending" hidden></span></button>
      <button data-tab="agents">Agents</button>
      <button data-tab="leads">Leads<span class="pill" id="pLeads" hidden></span></button>
      <button data-tab="messages">Messages<span class="pill" id="pMsgs" hidden></span></button>
    </nav>
    <div style="display:flex;gap:8px;align-items:center"><span id="who" style="font-size:13px;opacity:.8"></span><button class="btn sm ghost" style="color:#f5efe6;border-color:#f5efe6" id="logout">Log out</button></div>
  </header>
  <main id="main"></main>
</div>

<div class="modal" id="modal" role="dialog" aria-modal="true"><div class="sheet" id="sheet"></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="admin.js"></script>
</body>
</html>
